name: FTP-sti tjek

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Sti der skal listes (fx / eller /public_html/)'
        required: true
        default: '/'

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: List FTP-sti og commit resultatet (ingen secrets i output)
        run: |
          set +e
          mkdir -p .ftp-debug
          if [[ "${{ inputs.path }}" == */ ]]; then
            curl -s --list-only "ftp://${{ secrets.FTP_SERVER }}${{ inputs.path }}" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" > /tmp/out.txt
          else
            curl -s "ftp://${{ secrets.FTP_SERVER }}${{ inputs.path }}" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" > /tmp/out.txt
          fi
          code=$?
          {
            echo "Sti: ${{ inputs.path }}"
            echo "curl exit: $code"
            echo "---"
            cat /tmp/out.txt
          } > .ftp-debug/listing.txt
          cat .ftp-debug/listing.txt
          set -e
          git config user.name "ftp-debug"
          git config user.email "ftp-debug@users.noreply.github.com"
          git add .ftp-debug/listing.txt
          git commit -m "FTP-debug listing" || echo "intet at committe"
          git push origin HEAD:refs/heads/ftp-debug --force
