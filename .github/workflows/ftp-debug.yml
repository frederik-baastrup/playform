name: FTP-rod tjek

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Sti der skal listes (fx / eller /public_html/)'
        required: true
        default: '/'

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: List FTP-sti og commit resultatet
        run: |
          mkdir -p .ftp-debug
          {
            echo "Sti: ${{ inputs.path }}"
            echo "---"
            curl -s --list-only "ftp://${{ secrets.FTP_SERVER }}${{ inputs.path }}" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" | tr -d '\r'
            echo "---curl exit: $?---"
          } > .ftp-debug/listing.txt
          cat .ftp-debug/listing.txt
          git config user.name "ftp-debug"
          git config user.email "ftp-debug@users.noreply.github.com"
          git add .ftp-debug/listing.txt
          git commit -m "FTP-debug listing" || echo "intet at committe"
          git push origin HEAD:refs/heads/ftp-debug --force
