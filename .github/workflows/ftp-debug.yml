name: FTP-debug (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Find den rigtige WordPress-rod
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          L() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate no; $1; bye" "$FTP_SERVER"; }
          {
            echo "== pwd =="; L "pwd"
            echo "== ls . =="; L "cls -1a ."
            echo "== ls .. =="; L "cls -1a .."
            echo "== ls public_html =="; L "cls -1a public_html"
            echo "== ls wp-content/themes (fra roden) =="; L "cls -1 wp-content/themes"
            echo "== version i ./wp-content/themes/playform/functions.php =="
            L "get -O . wp-content/themes/playform/functions.php" && grep -n "PLAYFORM_THEME_VERSION'," functions.php
          } > resultat_ftp.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B ftp-debug-result
          git add resultat_ftp.txt
          git commit -m "FTP-debug-resultat" --allow-empty
          git push -f origin ftp-debug-result
