name: Udrul til SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sitet ligger i mappen frederikb7.sg-host.com/public_html på FTP-kontoen.
# Når playform.dk bliver hoveddomæne, kan SiteGround omdøbe mappen – så skal stien rettes her.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Udrul pluginnet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./wp-content/plugins/playform-feeds/
          server-dir: frederikb7.sg-host.com/public_html/wp-content/plugins/playform-feeds/
          dangerous-clean-slate: false

      - name: Udrul temaet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./wp-content/themes/playform/
          server-dir: frederikb7.sg-host.com/public_html/wp-content/themes/playform/
          dangerous-clean-slate: false
