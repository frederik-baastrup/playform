name: Diagnose (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hent fejllogs fra serveren (kun Playform-relevante linjer)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          R=frederikb7.sg-host.com/public_html
          L() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate no; $1; bye" "$FTP_SERVER" 2>&1 | grep -v -i "pass\|ftp://"; }
          mkdir -p logs
          {
            echo "== filer i roden =="; L "cls -1 $R" | grep -v "/$" | sed "s#.*/##"
            echo "== wp-content =="; L "cls -1 $R/wp-content" | sed "s#.*/##"
            for f in error_log php_errorlog wp-content/debug.log wp-admin/error_log; do
              L "get -O logs $R/$f" >/dev/null
            done
            ls -la logs
            for f in logs/*; do
              echo "== $f (seneste fatale fejl / playform) =="
              grep -a -i "fatal\|playform\|parse error" "$f" | tail -40 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g; s#/home/[^/]+/#/home/…/#g' | cut -c1-400
            done
          } > diag.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B diag-result
          git add diag.txt
          git commit -m "Diag-resultat" --allow-empty
          git push -f origin diag-result
