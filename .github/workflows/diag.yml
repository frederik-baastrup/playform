name: Diagnose (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hent fejllogs fra serveren (kun Playform-relevante linjer)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          R=frederikb7.sg-host.com/public_html
          L() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate no; $1; bye" "$FTP_SERVER" 2>&1 | grep -v -i "pass\|ftp://"; }
          mkdir -p logs
          {
            UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
            H=https://frederikb7.sg-host.com
            curl -sS -A "$UA" -o /dev/null -w "forside HTTP %{http_code} %{time_total}s\n" "$H/"
            for u in /tilbud/ /traeningsmaskiner/lobebaand/tilbud/ /traeningsmaskiner/romaskiner-crosstrainere/romaskine/ /produkt/powr-4-pro-kettlebell-ab16/; do
              curl -sS -A "$UA" -o b.html -w "$u HTTP %{http_code} %{size_download}b\n" "$H$u"
              python3 - <<'PY'
          import re
          h = open('b.html', encoding='utf-8', errors='replace').read()
          print('   h1:', re.findall(r'<h1[^>]*>(.*?)</h1>', h, re.S)[:1])
          print('   antal:', re.findall(r'<b>(\d+)</b> produkter', h)[:1])
          print('   trust:', 'pd__trust' in h, '| faner:', re.findall(r'class="tab[^"]*"[^>]*>([^<]+)', h)[:8])
          print('   lignende:', re.findall(r'<h2>(Lignende[^<]*)</h2>', h)[:1], '| cache:', re.findall(r'(?i)x-proxy-cache|sg-optimizer|cached', h)[:2])
          PY
            done
          } > diag.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B diag-result
          git add diag.txt
          git commit -m "Diag-resultat" --allow-empty
          git push -f origin diag-result
