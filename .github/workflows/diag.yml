name: Diagnose (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Tjek siden og fejlloggen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          R=frederikb7.sg-host.com/public_html
          L() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate no; $1; bye" "$FTP_SERVER" 2>&1 | grep -v -i "pass\|ftp://"; }
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          {
            for i in 1 2 3; do
              curl -sS -A "$UA" -o b.html -w "forside HTTP %{http_code} %{time_total}s: " https://frederikb7.sg-host.com/
              grep -o "Error establishing a database connection\|<title>[^<]*</title>" b.html | head -1; sleep 5
            done
            mkdir -p logs
            L "cls -l $R/wp-config.php $R/php_errorlog $R/wp-content/playform-deploy.txt"
            L "get -O logs $R/php_errorlog" >/dev/null
            echo "== seneste linjer i php_errorlog (filtreret) =="
            tail -n 30 logs/php_errorlog 2>/dev/null | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g; s#/home/[^/]+/#/home/…/#g' | cut -c1-300
            L "get -O logs $R/wp-config.php" >/dev/null
            echo "== wp-config (kun navne på DB-konstanter, ingen værdier) =="
            grep -o "define( *'DB_[A-Z_]*'" logs/wp-config.php
            grep -c "DB_PASSWORD" logs/wp-config.php
            rm -f logs/wp-config.php
          } > diag.txt 2>&1
          exit 0
      - name: Commit resultat til branch
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B diag-result
          git add diag.txt
          git commit -m "Diag-resultat" --allow-empty
          git push -f origin diag-result
