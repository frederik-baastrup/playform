name: Diagnose (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hent fejllogs fra serveren (kun Playform-relevante linjer)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          R=frederikb7.sg-host.com/public_html
          L() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate no; $1; bye" "$FTP_SERVER" 2>&1 | grep -v -i "pass\|ftp://"; }
          mkdir -p logs
          {
            echo "== plugins =="; L "cls -1 $R/wp-content/plugins"
            echo "== themes =="; L "cls -1 $R/wp-content/themes"
            for d in $(L "cls -1 $R/wp-content/plugins" | grep -i playform); do
              echo "== $d =="; L "cls -1 $d"
              L "get -O logs $d/playform-feeds.php" >/dev/null && grep -n "Version\|PLAYFORM_FEEDS_VERSION'" logs/playform-feeds.php && rm logs/playform-feeds.php
            done
          } > diag.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B diag-result
          git add diag.txt
          git commit -m "Diag-resultat" --allow-empty
          git push -f origin diag-result
