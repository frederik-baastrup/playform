name: Diagnose (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hent fejllogs fra serveren (kun Playform-relevante linjer)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          R=frederikb7.sg-host.com/public_html
          L() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate no; $1; bye" "$FTP_SERVER" 2>&1 | grep -v -i "pass\|ftp://"; }
          mkdir -p logs
          {
            UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
            for u in / /tilbud/ /traeningsmaskiner/; do
              echo "== GET $u =="; curl -sS -A "$UA" -o body.html -w "HTTP %{http_code} %{size_download} bytes\n" "https://frederikb7.sg-host.com$u"; head -c 300 body.html; echo
            done
            sleep 5
            L "get -O logs $R/wp-content/uploads/playform-diag.json" >/dev/null
            echo "== playform-diag.json =="; cat logs/playform-diag.json
          } > diag.txt 2>&1
          exit 0

      - name: Commit resultat til branch
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B diag-result
          git add diag.txt
          git commit -m "Diag-resultat" --allow-empty
          git push -f origin diag-result
