name: Billedkandidater (Unsplash)
on:
  push:
    branches: [covers-review]
    paths: [tools/pexels_sheets.py]
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/pexels_sheets.py
      - name: Gem kontaktark på grenen covers-result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan covers-result
          git rm -rq --cached .
          git add -f out
          git commit -qm "Kandidater"
          git push -f origin covers-result
