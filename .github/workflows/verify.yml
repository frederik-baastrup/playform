name: Tjek indhold på siden

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL der skal tjekkes'
        required: true
      needle:
        description: 'Tekst der skal findes på siden'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hent side og søg efter tekst
        run: |
          html=$(curl -sL "${{ inputs.url }}")
          echo "$html" > page.html
          if echo "$html" | grep -qF "${{ inputs.needle }}"; then
            echo "FUNDET"
            exit 0
          else
            echo "IKKE FUNDET"
            echo "--- uddrag af siden ---"
            echo "$html" | sed -n '1,50p'
            exit 1
          fi
