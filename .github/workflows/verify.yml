name: Tjek udrulning (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent forside og kategorisider, tjek version og omdirigering
        shell: bash
        run: |
          set +e
          {
            echo "== Forside (css/js version) =="
            curl -s https://playform.dk/ -o forside.html
            grep -o "main.css?ver=[0-9.]*" forside.html
            grep -o "main.js?ver=[0-9.]*" forside.html
            echo ""
            echo "== /kategori/motionscykler/ (skal 301) =="
            curl -s -o /dev/null -D - https://playform.dk/kategori/motionscykler/ | grep -i "^HTTP\|^location"
            echo ""
            echo "== /motionscykler/ (ny flad URL) =="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" https://playform.dk/motionscykler/
            echo ""
            echo "== /kondiudstyr/romaskiner-crosstrainere/ bund (SEO/FAQ) =="
            curl -s https://playform.dk/kondiudstyr/romaskiner-crosstrainere/ -o side.html
            grep -c "pf_seo_text\|Ofte stillede" side.html
          } > resultat.txt 2>&1
          cat resultat.txt

      - name: Commit resultat til branch
        shell: bash
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@example.com"
          git checkout -B verify-result
          git add resultat.txt
          git commit -m "Verify-resultat" --allow-empty
          git push -f origin verify-result
