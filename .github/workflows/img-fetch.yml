name: Hent artikelbilleder (Pexels)
on:
  push:
    branches: [img-fetch]
    paths: [tools/img_list.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/img_fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan img-result
          git rm -rq --cached .
          git add -f out
          git commit -qm "Billeder"
          git push -f origin img-result
